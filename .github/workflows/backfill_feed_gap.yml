name: One-off Feed Gap Backfill

on:
  workflow_dispatch: # Manual only — one-off catch-up for the 2026-08-17 keep-alive outage.
    inputs:
      until_date:
        description: "Walk the feed back until this date (ISO 8601, UTC)"
        required: false
        default: "2026-08-17T00:00:00+00:00"
      max_pages:
        description: "Safety cap on how many feed pages to walk"
        required: false
        default: "300"

jobs:
  backfill_gap:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv supabase curl_cffi

      - name: Run Feed Gap Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STRAVA_CLUB_ID: ${{ secrets.STRAVA_CLUB_ID }}
          BACKFILL_UNTIL_DATE: ${{ inputs.until_date }}
          BACKFILL_MAX_PAGES: ${{ inputs.max_pages }}
        run: python backfill_feed_gap.py
