name: Manual Cleanup Corrupted Drafts

on:
  workflow_dispatch: # 🟢 Execução 100% manual através do botão no GitHub

jobs:
  cleanup-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install python-dotenv firebase-admin

      - name: Run Cleanup Script
        env:
          # Embora o script só precise do Firebase, deixo ambas as credenciais estruturadas por segurança
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python clean_corrupted_drafts.py
