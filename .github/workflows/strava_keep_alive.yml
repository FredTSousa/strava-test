name: Strava Session Keep-Alive

on:
  workflow_dispatch: # 🟢 Ativado remotamente pelo Supabase ou manualmente no GitHub

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Mantém a mesma versão do resto do projeto

      - name: Install Dependencies
        run: |
          pip install requests supabase curl_cffi

      - name: Run Keep Alive Script
        env:
          # 🔐 Segredos guardados no teu repositório do GitHub
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STRAVA_CLUB_ID: ${{ secrets.STRAVA_CLUB_ID }}
        run: python strava_keep_alive.py
