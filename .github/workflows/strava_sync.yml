name: 15-Minute Strava Sync

on:
  
  workflow_dispatch: # Allows you to press a button in GitHub to test run it anytime
  push:
    branches:
      - master      # <-- CHANGED FROM 'main' TO 'master'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv supabase firebase-admin

      - name: Run Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLUB_ID: ${{ secrets.STRAVA_CLUB_ID }}
        run: python cron_sync.py
  # ⚡ NOVO PASSO: Corre logo após o Strava terminar (e depois de todos os database triggers processarem o match)
      - name: 2. Correr o Sync de Treinos para o Firestore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }} # 🔐 O teu segredo do Firebase
        run: python sync_worker.py
