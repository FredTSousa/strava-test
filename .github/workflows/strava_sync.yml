name: Daily Strava Members Sync

on:
  workflow_dispatch: # Permite que a Supabase clique no "botão" via API ou manualmente no GitHub 

jobs:
  sync_strava_pipeline:
    runs-on: ubuntu-latest
    # 🟢 BOAS PRÁTICAS: Define um timeout global para o job não ficar preso a gastar minutos do GitHub se a API do Strava falhar
    timeout-minutes: 15 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests python-dotenv supabase firebase-admin curl_cffi beautifulsoup4

      # 🟢 PASSO 0: Espelha só os utilizadores novos do Firestore (incremental, barato em leituras).
      # A janela de 48h cobre falhas de runs; o scan completo continua no sync_users.yml diário.
      # continue-on-error: uma falha do Firebase não pode travar o sync de atividades.
      - name: Run Incremental Firestore Users Sync
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_USERS_LOOKBACK_HOURS: "48"
        run: python sync_firestore_users.py

      # 🟢 PASSO 1: Puxa as atividades (agora via crawler/atividades_clube, já não depende da API oficial)
      - name: Run Strava Activities Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cron_sync.py

      # 🟢 PASSO 2: Enriquece as atividades novas (elevação, etc.) visitando cada uma uma única vez
      - name: Run Activity Enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STRAVA_CLUB_ID: ${{ secrets.STRAVA_CLUB_ID }}
          ENRICH_BATCH_SIZE: "20"
        run: python enrich_activities.py

      # 🟢 PASSO 3: Espelha os treinos atribuídos para o Firestore
      - name: Run Workouts Sync to Firestore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python sync_worker.py

      # 🟢 PASSO 4: Sincroniza os membros do Clube (agora via crawler, já não depende da API oficial)
      - name: Run Members Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STRAVA_CLUB_ID: ${{ secrets.STRAVA_CLUB_ID }}
        run: python sync_members.py
